<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسار مشاريع Vibe Coding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#16212E; --ink-2:#3C4C5F; --ink-3:#6C7C8E;
  --paper:#ECEFF3; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --line:#D2DAE3; --line-strong:#B4C0CD;
  --signal:#D9711A; --signal-soft:#FBEBDB; --signal-ink:#8A4409;
  --ok:#0E7A6B; --ok-soft:#DCF0EC; --ok-ink:#0A5A4E;
  --go:#2F5FA8; --go-soft:#E2EAF7; --go-ink:#1E4079;
  --late:#B23A2E; --late-soft:#F8E3E0; --late-ink:#8A2B21;
  --idle-soft:#E8ECF1;
  --shadow:0 1px 2px rgba(22,33,46,.06), 0 8px 24px -12px rgba(22,33,46,.18);
  --radius:10px;
  --display:"Changa","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E7EDF4; --ink-2:#B3C0CE; --ink-3:#8494A5;
  --paper:#10171F; --surface:#18212C; --surface-2:#1E2935;
  --line:#2C3945; --line-strong:#3D4C5B;
  --signal:#F0913F; --signal-soft:#3A2412; --signal-ink:#F6BA7C;
  --ok:#3FBCA6; --ok-soft:#10312C; --ok-ink:#6FD6C3;
  --go:#6E9FE0; --go-soft:#152438; --go-ink:#9CC0F0;
  --late:#E4685A; --late-soft:#3A1915; --late-ink:#F09A8F;
  --idle-soft:#212C38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#E7EDF4; --ink-2:#B3C0CE; --ink-3:#8494A5;
  --paper:#10171F; --surface:#18212C; --surface-2:#1E2935;
  --line:#2C3945; --line-strong:#3D4C5B;
  --signal:#F0913F; --signal-soft:#3A2412; --signal-ink:#F6BA7C;
  --ok:#3FBCA6; --ok-soft:#10312C; --ok-ink:#6FD6C3;
  --go:#6E9FE0; --go-soft:#152438; --go-ink:#9CC0F0;
  --late:#E4685A; --late-soft:#3A1915; --late-ink:#F09A8F;
  --idle-soft:#212C38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.65;
  padding-block:0 52px; padding-inline:16px;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none !important}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--go-ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  margin-inline:-16px; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;
}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin-inline:auto}
.brandrow h1{font-size:20px;letter-spacing:-.01em}
.brandrow .sub{color:var(--ink-3);font-size:12.5px}
.spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin-inline:auto;padding-top:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:8px 13px 10px;
  font-size:14px;font-weight:500;white-space:nowrap;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal);font-weight:600}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;font-weight:500}
.stat .v{font-family:var(--display);font-size:25px;font-weight:600;line-height:1.25;margin-top:2px}
.stat .n{font-size:12px;color:var(--ink-3)}
.stat.alert{border-color:var(--late);background:var(--late-soft)}
.stat.alert .v,.stat.alert .k{color:var(--late-ink)}
.stat.focus{border-color:var(--signal);background:var(--signal-soft)}
.stat.focus .v,.stat.focus .k{color:var(--signal-ink)}

.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:780px}
table.board th,table.board td{border-bottom:1px solid var(--line);padding:0;text-align:right;vertical-align:top}
table.board thead th{background:var(--surface-2);padding:10px 12px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line-strong)}
thead th .due{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
thead th .w{display:inline-block;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-top:4px}
.gcell{position:sticky;inset-inline-start:0;background:var(--surface);z-index:2;border-inline-end:1px solid var(--line-strong);min-width:184px;padding:10px 12px !important}
thead .gcell{background:var(--surface-2);z-index:3}
.gname{font-weight:600;font-size:14px;display:block;cursor:pointer;background:none;border:0;padding:0;text-align:right;color:inherit;width:100%}
.gname:hover{color:var(--signal)}
.gmeta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.bar{height:4px;background:var(--idle-soft);border-radius:99px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
td.cellwrap{padding:7px !important}
.cell{width:100%;display:block;text-align:center;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);padding:9px 6px;font-size:12px;font-weight:500;color:var(--ink-3);
  transition:transform .08s ease, box-shadow .12s ease}
.cell.act{cursor:pointer}
.cell.act:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cell .lab{display:block}
.cell .sc{display:block;font-size:11px;margin-top:2px;opacity:.85}
.cell .note{display:block;font-size:10.5px;margin-top:3px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell[data-s="wip"]{background:var(--signal-soft);border-color:var(--signal);color:var(--signal-ink)}
.cell[data-s="submitted"]{background:var(--go-soft);border-color:var(--go);color:var(--go-ink)}
.cell[data-s="approved"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.cell[data-s="blocked"]{background:var(--late-soft);border-color:var(--late);color:var(--late-ink)}
.cell[data-s="none"]{border-style:dashed}
.cell[data-late="1"]{box-shadow:inset 3px 0 0 var(--late)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--line)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.card.risk{border-inline-start:3px solid var(--late)}
.card h3{font-size:16px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-3);background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.chip.late{background:var(--late-soft);border-color:var(--late);color:var(--late-ink)}
.chip.sig{background:var(--signal-soft);border-color:var(--signal);color:var(--signal-ink)}
.chip.go{background:var(--go-soft);border-color:var(--go);color:var(--go-ink)}
.canvas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.canvas div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.canvas .k{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.canvas .v{font-size:12.5px;margin-top:2px}
.members{font-size:12.5px;color:var(--ink-2)}

.tl-item{display:grid;grid-template-columns:136px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-date{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-date .rel{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tl-date .rel.now{color:var(--late);font-weight:600}
.tl-body h3{font-size:16.5px}
.tl-body .desc{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.tl-body ul{margin:9px 0 0;padding-inline-start:18px;font-size:13px;color:var(--ink-2)}
.mini{height:6px;background:var(--idle-soft);border-radius:99px;margin-top:10px;max-width:280px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--go)}
.tl-body .cnt{font-size:11.5px;color:var(--ink-3);margin-top:4px}

table.grid{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
table.grid th,table.grid td{border:1px solid var(--line);padding:8px 10px;text-align:right}
table.grid thead th{background:var(--surface-2);font-size:12px;font-weight:600}
table.grid td.tot{font-weight:600;background:var(--surface-2)}

.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.ev .what{font-size:13.5px}
.ev .who{font-size:11.5px;color:var(--ink-3);margin-top:1px}

.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:7px 14px;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.03em}
input.t,textarea.t,select.t{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px}
textarea.t{resize:vertical;min-height:58px;line-height:1.55}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.sec h2{font-size:16px;margin-bottom:4px}
.sec .hint{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}

.veil{position:fixed;inset:0;background:rgba(10,16,23,.45);z-index:50}
.modal{position:fixed;z-index:51;inset-block-start:50%;inset-inline-start:50%;transform:translate(50%,-50%);
  width:min(440px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;background:var(--paper);
  border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.modal h2{font-size:17px;margin-bottom:10px}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100%);z-index:51;background:var(--paper);
  border-inline-start:1px solid var(--line);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
.pop{position:fixed;z-index:60;width:min(292px,calc(100vw - 32px));background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px}
.pop .ttl{font-size:12px;color:var(--ink-3);margin-bottom:8px;line-height:1.45}
.statuses{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.st{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px;font-size:12.5px;cursor:pointer}
.st[aria-pressed="true"]{border-width:2px;font-weight:600}
.st[data-s="wip"][aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal);color:var(--signal-ink)}
.st[data-s="submitted"][aria-pressed="true"]{background:var(--go-soft);border-color:var(--go);color:var(--go-ink)}
.st[data-s="blocked"][aria-pressed="true"]{background:var(--late-soft);border-color:var(--late);color:var(--late-ink)}
.st[data-s="none"][aria-pressed="true"]{border-color:var(--line-strong)}

.step{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;background:var(--surface-2)}
.step .sn{width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500}
.step.done .sn{background:var(--ok);color:#fff}
.step .sd{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.75}
.step strong{font-size:14.5px}
.step b{font-weight:600;color:var(--ink)}
.banner{background:var(--signal-soft);border:1px solid var(--signal);color:var(--signal-ink);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin:14px 0}
.banner.bad{background:var(--late-soft);border-color:var(--late);color:var(--late-ink)}
.banner.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-3)}
.toast{position:fixed;inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;
  transform:translateX(50%);z-index:80;background:var(--ink);color:var(--paper);
  padding:9px 18px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow)}
footer.f{margin-top:26px;font-size:11.5px;color:var(--ink-3);text-align:center}
code.k{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px}

@media (max-width:560px){ .canvas{grid-template-columns:1fr} .tl-item{grid-template-columns:1fr;gap:6px} .brandrow h1{font-size:17px} }
@media print{ header.top,.tabs,.btn,.legend{display:none !important} body{background:#fff;padding:0} .sec,.card,.scroller{box-shadow:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1 id="hTitle">مسار مشاريع Vibe Coding</h1>
      <span class="sub" id="hCourse"></span>
      <span class="spacer"></span>
      <span class="chip sig" id="hNext"></span>
      <span id="hAuth" class="row"></span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="view"><div class="empty">جارِ التحميل…</div></main>
  <footer class="f" id="foot"></footer>
</div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================ حالة التطبيق ============================ */
var S = {
  settings:{title:"مسار مشاريع Vibe Coding",course:"",org:"",totalMarks:7},
  milestones:[], groups:[], progress:{}, evals:{}, log:[],
  role:"public",          // public | group | teacher
  myGroup:null,           // {id,name,...} في وضع المجموعة
  myCode:"", actor:"",
  tab:"board", err:"", ready:false
};
var sb=null;
var LS="vibe-tracker-session";

var STATUSES=[
  {k:"none",t:"لم تبدأ"},{k:"wip",t:"قيد العمل"},
  {k:"submitted",t:"سلّمنا"},{k:"blocked",t:"متعثرة"}
];
var ST={none:"لم تبدأ",wip:"قيد العمل",submitted:"سُلّمت",blocked:"متعثرة",approved:"معتمدة"};

/* ============================ أدوات ============================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
function btn(t,cls,fn){var b=el("button","btn "+(cls||""),t); b.type="button"; b.onclick=fn; return b;}
function q(id){return document.getElementById(id);}
var fmtDay=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long"});
var fmtFull=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
var fmtTime=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function parseD(s){var p=String(s||"").split("-");return new Date(+p[0],(+p[1])-1,+p[2]);}
function daysTo(s){return Math.round((parseD(s)-today())/86400000);}
function relText(s){var d=daysTo(s); if(d===0)return "اليوم"; if(d===1)return "غداً"; if(d>0)return "بعد "+d+" يوم"; return "متأخر "+Math.abs(d)+" يوم";}
function dayName(s){return fmtFull.format(parseD(s));}
function toast(m){var t=el("div","toast",m);document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function closeLayer(){q("layer").innerHTML="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeLayer();});

function P(gid,mid){return S.progress[gid+"|"+mid]||{status:"none",note:"",evidence_url:"",approved:false};}
function E(gid,mid){return S.evals[gid+"|"+mid]||{score:null,teacher_note:""};}
function cellState(gid,mid){var p=P(gid,mid); return p.approved?"approved":p.status;}
function isLate(gid,m){var st=cellState(gid,m.id); return st!=="approved" && st!=="submitted" && daysTo(m.due)<0;}
function gDone(gid){var n=0;S.milestones.forEach(function(m){var st=cellState(gid,m.id); if(st==="approved"||st==="submitted")n++;});return n;}
function gLate(gid){var n=0;S.milestones.forEach(function(m){if(isLate(gid,m))n++;});return n;}
function gScore(gid){var t=0,any=false;S.milestones.forEach(function(m){var e=E(gid,m.id);if(typeof e.score==="number"){t+=e.score;any=true;}});return any?Math.round(t*100)/100:null;}
function nextMilestone(){var u=S.milestones.filter(function(m){return daysTo(m.due)>=0;});return u.length?u[0]:S.milestones[S.milestones.length-1];}

/* ============================ الاتصال ============================ */
var LSC="vibe-tracker-config";
function readCfg(){
  try{ var r=JSON.parse(localStorage.getItem(LSC)||"null"); if(r&&r.url&&r.key) return r; }catch(e){}
  var c=window.TRACKER_CONFIG||{};
  if(c.SUPABASE_URL&&c.SUPABASE_ANON_KEY) return {url:c.SUPABASE_URL,key:c.SUPABASE_ANON_KEY,fromFile:true};
  return null;
}
function writeCfg(u,k){ try{ localStorage.setItem(LSC,JSON.stringify({url:u,key:k})); }catch(e){} }
function configured(){ return !!readCfg(); }
function connect(){
  if(!window.supabase||!window.supabase.createClient){ S.err="lib"; render(); return false; }
  var c=readCfg(); if(!c) return false;
  sb=window.supabase.createClient(c.url,c.key);
  return true;
}
async function ensureLib(){
  if(window.supabase&&window.supabase.createClient) return true;
  await new Promise(function(res){
    var t=document.createElement("script");
    t.src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js";
    t.onload=res; t.onerror=res; document.head.appendChild(t);
  });
  return !!(window.supabase&&window.supabase.createClient);
}

/* فحص الإعداد — يحدّد بالضبط أين توقّف الأمر */
async function diagnose(url,key){
  url=String(url||"").trim().replace(/\/+$/,""); key=String(key||"").trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url))
    return {ok:false,step:"url",msg:"رابط المشروع غير صحيح. يجب أن يكون بالشكل: https://xxxxxxxx.supabase.co"};
  if(key.length<30)
    return {ok:false,step:"key",msg:"المفتاح ناقص — تأكدي من نسخه كاملاً."};
  if(!(await ensureLib()))
    return {ok:false,step:"lib",msg:"تعذّر تحميل مكتبة الاتصال. تحقّقي من الإنترنت وأعيدي تحميل الصفحة."};
  var c;
  try{ c=window.supabase.createClient(url,key); }
  catch(e){ return {ok:false,step:"url",msg:"تعذّر إنشاء الاتصال: "+(e.message||"")}; }
  var r;
  try{ r=await c.from("milestones").select("id,name").order("ord"); }
  catch(e){ return {ok:false,step:"net",msg:"لم أصل إلى المشروع. تأكدي أن الرابط صحيح وأن المشروع يعمل وليس متوقفاً (Paused)."}; }
  if(r.error){
    var m=(r.error.message||"")+" "+(r.error.code||"")+" "+(r.error.hint||"");
    if(/JWT|api ?key|Invalid|401|403|unauthor/i.test(m))
      return {ok:false,step:"key",msg:"المفتاح لا يطابق هذا المشروع. انسخي مفتاح anon / publishable من صفحة API الخاصة بنفس المشروع."};
    if(/does not exist|42P01|PGRST205|schema cache|Could not find the table/i.test(m))
      return {ok:false,step:"sql",msg:"الاتصال سليم، لكن الجداول لم تُنشأ بعد. ارجعي للخطوة ١ وشغّلي كود SQL."};
    return {ok:false,step:"net",msg:"رسالة من قاعدة البيانات: "+(r.error.message||"")};
  }
  if(!r.data||!r.data.length)
    return {ok:false,step:"sql",msg:"الجداول موجودة لكنها فارغة. أعيدي تشغيل كود SQL كاملاً مرة أخرى."};
  return {ok:true,msg:"الاتصال سليم و"+r.data.length+" مراحل جاهزة."};
}

var SQL_CACHE=null;
async function getSql(){
  if(SQL_CACHE) return SQL_CACHE;
  try{ var r=await fetch("supabase/schema.sql",{cache:"no-store"}); if(r.ok){ SQL_CACHE=await r.text(); return SQL_CACHE; } }catch(e){}
  return null;
}

async function loadAll(){
  try{
    var r = await Promise.all([
      sb.from("settings").select("key,value").eq("key","activity").maybeSingle(),
      sb.from("milestones").select("*").order("ord"),
      sb.from("groups").select("id,name,ord,members,idea,links,ai_tools,updated_at").order("ord"),
      sb.from("progress").select("*"),
      sb.from("activity_log").select("*").order("created_at",{ascending:false}).limit(80)
    ]);
    if(r[0].data&&r[0].data.value) S.settings=Object.assign(S.settings,r[0].data.value);
    S.milestones = (r[1].data||[]).map(function(m){ m.due=m.due_date; m.weight=+m.weight; return m; });
    S.groups     = r[2].data||[];
    S.progress   = {}; (r[3].data||[]).forEach(function(p){ S.progress[p.group_id+"|"+p.milestone_id]=p; });
    S.log        = r[4].data||[];
    if(S.role==="teacher"){
      var ev = await sb.from("evaluations").select("*");
      S.evals={}; (ev.data||[]).forEach(function(e){ S.evals[e.group_id+"|"+e.milestone_id]=e; });
    }
    S.err=""; S.ready=true;
  }catch(e){ S.err="net"; S.ready=true; }
  render();
}

function subscribeLive(){
  try{
    sb.channel("tracker")
      .on("postgres_changes",{event:"*",schema:"public",table:"progress"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"groups"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"milestones"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"activity_log"},loadAll)
      .subscribe();
  }catch(e){}
}

function exportCsv(){
  var M=S.milestones, rows=[];
  rows.push(["المجموعة"].concat(M.map(function(m){return m.name+" (من "+(+m.weight)+")";})).concat(["المجموع","الأعضاء","الفكرة"]));
  S.groups.forEach(function(g){
    var tot=0;
    var cells=M.map(function(m){var e=E(g.id,m.id); if(typeof e.score==="number"){tot+=e.score;return String(e.score);} return "";});
    rows.push([g.name].concat(cells).concat([String(Math.round(tot*100)/100),(g.members||[]).filter(Boolean).join(" / "),(g.idea&&g.idea.title)||""]));
  });
  var text="﻿"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="vibe-coding-scores.csv"; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------------------------- الإعدادات ---------------------------- */
function viewSetup(host){
  var a=el("div","sec");
  a.innerHTML='<h2>بيانات الفعالية</h2><div class="hint">تظهر في أعلى الصفحة وفي النسخة المطبوعة.</div>'+
    '<div class="fields">'+
    '<div><label class="f" for="cT">العنوان</label><input class="t" id="cT" value="'+esc(S.settings.title||"")+'"></div>'+
    '<div><label class="f" for="cC">المقرر / الفعالية</label><input class="t" id="cC" value="'+esc(S.settings.course||"")+'"></div>'+
    '<div><label class="f" for="cO">الجهة</label><input class="t" id="cO" value="'+esc(S.settings.org||"")+'"></div>'+
    '<div><label class="f" for="cM">الدرجة الكلية</label><input class="t num" id="cM" type="number" min="1" step="0.5" value="'+(S.settings.totalMarks||7)+'"></div>'+
    '</div>';
  var ar=el("div","row"); ar.style.marginTop="11px";
  ar.appendChild(btn("حفظ","primary sm",async function(){
    var v={title:q("cT").value.trim(),course:q("cC").value.trim(),org:q("cO").value.trim(),totalMarks:parseFloat(q("cM").value)||7};
    var r=await sb.from("settings").upsert({key:"activity",value:v},{onConflict:"key"});
    if(r.error){toast("تعذّر الحفظ: "+r.error.message);return;}
    toast("تم الحفظ"); loadAll();
  }));
  a.appendChild(ar); host.appendChild(a);

  var g=el("div","sec");
  g.innerHTML='<h2>المراحل والمواعيد</h2><div class="hint">عدّلي التواريخ لتوافق تقويم الفصل، والأوزان بحيث يساوي مجموعها الدرجة الكلية.</div>';
  S.milestones.forEach(function(m,i){
    var box=el("div");
    box.style.cssText="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface-2)";
    box.innerHTML='<div class="fields">'+
      '<div style="grid-column:1/-1"><label class="f" for="sn'+i+'">اسم المرحلة</label><input class="t" id="sn'+i+'" value="'+esc(m.name)+'"></div>'+
      '<div><label class="f" for="sd'+i+'">الموعد</label><input class="t num" id="sd'+i+'" type="date" value="'+esc(m.due_date)+'"></div>'+
      '<div><label class="f" for="sw'+i+'">الدرجة</label><input class="t num" id="sw'+i+'" type="number" min="0" step="0.25" value="'+(+m.weight)+'"></div></div>'+
      '<div style="margin-top:9px"><label class="f" for="sx'+i+'">الوصف</label><input class="t" id="sx'+i+'" value="'+esc(m.description||"")+'"></div>'+
      '<div style="margin-top:9px"><label class="f" for="si'+i+'">المطلوب تسليمه (سطر لكل بند)</label><textarea class="t" id="si'+i+'" rows="3">'+esc((m.items||[]).join("\n"))+'</textarea></div>';
    g.appendChild(box);
  });
  var gr=el("div","row");
  gr.appendChild(btn("حفظ المراحل","primary sm",async function(){
    for(var i=0;i<S.milestones.length;i++){
      var m=S.milestones[i];
      var r=await sb.from("milestones").update({
        name:q("sn"+i).value.trim()||m.name,
        due_date:q("sd"+i).value||m.due_date,
        weight:parseFloat(q("sw"+i).value)||0,
        description:q("sx"+i).value.trim(),
        items:q("si"+i).value.split("\n").map(function(s){return s.trim();}).filter(Boolean)
      }).eq("id",m.id);
      if(r.error){ toast("تعذّر الحفظ: "+r.error.message); return; }
    }
    toast("تم حفظ المراحل"); loadAll();
  }));
  g.appendChild(gr); host.appendChild(g);

  var c=el("div","sec");
  c.innerHTML='<h2>رموز دخول المجموعات</h2><div class="hint">أرسلي لكل مجموعة رمزها — به تدخل الطالبات وتحدّثن تقدمهن دون حساب.</div>';
  var lst=el("div"); lst.innerHTML='<div class="empty" style="padding:14px">جارِ التحميل…</div>';
  c.appendChild(lst);
  var cr=el("div","row"); cr.style.marginTop="10px";
  cr.appendChild(btn("+ إضافة مجموعة","sm",openNewGroup));
  c.appendChild(cr); host.appendChild(c);
  sb.from("groups").select("id,name,code,ord").order("ord").then(function(r){
    if(r.error){ lst.innerHTML='<div class="banner bad">تعذّر قراءة الرموز.</div>'; return; }
    var t=el("table","grid");
    t.innerHTML='<thead><tr><th>المجموعة</th><th>الرمز</th></tr></thead><tbody>'+
      (r.data||[]).map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="num"><code class="k">'+esc(x.code)+'</code></td></tr>';}).join("")+'</tbody>';
    lst.innerHTML=""; lst.appendChild(t);
  });
}

/* ---------------------------- تسجيل الدخول ---------------------------- */
function openGroupLogin(){
  closeLayer();
  var ses=readSession();
  var veil=el("div","veil"); veil.onclick=closeLayer; q("layer").appendChild(veil);
  var d=el("div","modal");
  d.innerHTML='<h2>دخول المجموعة</h2><div class="hint" style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">أدخلي رمز مجموعتك الذي أرسلته المشرفة.</div>'+
    '<label class="f" for="gc">رمز المجموعة</label><input class="t num" id="gc" placeholder="VC-XXXX" value="'+esc(ses.code||"")+'" autocomplete="off">'+
    '<div style="margin-top:10px"><label class="f" for="gn">اسمك (يظهر في سجل الخطوات)</label><input class="t" id="gn" value="'+esc(ses.actor||"")+'"></div>'+
    '<div id="ge"></div><div class="row" style="margin-top:14px;justify-content:flex-end"></div>';
  var row=d.querySelector(".row");
  row.appendChild(btn("إلغاء","",closeLayer));
  var ok=btn("دخول","primary",async function(){
    ok.disabled=true;
    try{ await groupSignIn(q("gc").value,q("gn").value); closeLayer(); S.tab="mine"; await loadAll(); toast("أهلاً بكن"); }
    catch(e){ q("ge").innerHTML='<div class="banner bad" style="margin:10px 0 0">'+esc(e.message||"رمز غير صحيح")+'</div>'; ok.disabled=false; }
  });
  row.appendChild(ok);
  q("layer").appendChild(d); q("gc").focus();
}
function openTeacherLogin(){
  closeLayer();
  var veil=el("div","veil"); veil.onclick=closeLayer; q("layer").appendChild(veil);
  var d=el("div","modal");
  d.innerHTML='<h2>دخول المشرفة</h2><div class="hint" style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">الحساب الذي أنشأتِه في Supabase → Authentication.</div>'+
    '<label class="f" for="te">البريد الإلكتروني</label><input class="t" id="te" type="email" autocomplete="username">'+
    '<div style="margin-top:10px"><label class="f" for="tp">كلمة المرور</label><input class="t" id="tp" type="password" autocomplete="current-password"></div>'+
    '<div id="tee"></div><div class="row" style="margin-top:14px;justify-content:flex-end"></div>';
  var row=d.querySelector(".row");
  row.appendChild(btn("إلغاء","",closeLayer));
  var ok=btn("دخول","primary",async function(){
    ok.disabled=true;
    try{ await teacherSignIn(q("te").value.trim(),q("tp").value); closeLayer(); toast("أهلاً بك"); }
    catch(e){ q("tee").innerHTML='<div class="banner bad" style="margin:10px 0 0">تعذّر الدخول: '+esc(e.message||"")+'</div>'; ok.disabled=false; }
  });
  row.appendChild(ok);
  d.querySelector("#tp").addEventListener("keydown",function(e){ if(e.key==="Enter") ok.click(); });
  q("layer").appendChild(d); q("te").focus();
}

/* ---------------------------- الإقلاع ---------------------------- */
async function restart(){ S.err=""; S.ready=false; S.role="public"; await boot(); }
async function boot(){
  render();
  await ensureLib();
  if(!configured()){ render(); return; }
  if(!connect()) return;
  try{
    var ses=await sb.auth.getSession();
    if(ses.data&&ses.data.session) S.role="teacher";
  }catch(e){}
  if(S.role!=="teacher"){
    var st=readSession();
    if(st.code){ try{ await groupSignIn(st.code,st.actor); }catch(e){ try{localStorage.removeItem(LS);}catch(_){} } }
  }
  await loadAll();
  subscribeLive();
}
boot();
})();
</script>
